# ==========================================================
#  AntWars - arenes et modes
# ==========================================================
# La map contient deux terrains :
#   - terrain 2 equipes : bases Rouge (-43,156) et Bleu (-124,74) ;
#   - terrain 4 equipes : Rouge (0,100), Bleu (0,0), Jaune (100,100),
#                         Vert (100,0).
#
# Les noms de modes sont ceux de la commande /aw join :
#   2x2       = 2 equipes de 2 (max 4 joueurs)
#   4x4       = 2 equipes de 4 (max 8 joueurs)
#   2x2x2x2   = 4 equipes de 2 (max 8 joueurs)
#   4x4x4x4   = 4 equipes de 4 (max 16 joueurs)
#
# Le lobby est commun : salle en verre noir au nord-ouest (-143, 50, -46).
# borderCenter est le centre de la bordure de deathmatch, pas le lobby :
# il doit rester au centre du terrain utilise.

arenes:
  '2x2':
    nom: 2x2
    minPlayers: 2
    maxPlayers: 4
    teamCount: 2
    playersPerTeam: 2
    borderTime: 1200
    allowSpectators: true
    lobby:
      world: world
      x: -142.5
      y: 50.0
      z: -45.5
      yaw: 0.0
      pitch: 0.0
    borderCenter:
      world: world
      x: -83.5
      y: 0.0
      z: 115.5
    spawnPoints:
      Rouge:
        world: world
        x: -46.0
